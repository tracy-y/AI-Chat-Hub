<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat Hub</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">LOCAL · SUBSCRIPTION FIRST</p>
          <h1>AI Chat Hub</h1>
        </div>
        <button id="new-chat" class="text-button" type="button">新对话</button>
      </header>

      <section class="chat-shell" aria-label="AI Chat Hub 对话">
        <div id="timeline" class="timeline" aria-live="polite">
          <div id="empty-state" class="empty-state">
            <span class="empty-mark">@</span>
            <h2>选择要回答的 Agent</h2>
            <p><code>@codex</code>、<code>@claude</code> 或 <code>@all</code>。不写 @ 时默认同时询问两个。</p>
          </div>
        </div>

        <div class="composer">
          <div class="mention-bar" aria-label="选择 Agent">
            <button type="button" data-mention="@codex">@codex</button>
            <button type="button" data-mention="@claude">@claude</button>
            <button type="button" data-mention="@all">@all</button>
            <span id="connection-status">本机直连</span>
          </div>
          <label class="sr-only" for="prompt">消息</label>
          <textarea id="prompt" rows="3" maxlength="50000" placeholder="@codex 帮我分析……"></textarea>
          <div class="composer-footer">
            <p id="form-error" class="form-error" role="alert" hidden></p>
            <span class="privacy-note">最近 20 条作为共享上下文</span>
            <button id="send-message" type="button" aria-label="发送消息">发送</button>
          </div>
        </div>
      </section>

      <details class="manual-fallback">
        <summary>本地 Companion 不可用？手动保存网页原文</summary>
        <p>手动回复会关联到最近一条用户消息。</p>
        <div class="relay-grid">
          <article class="relay-card" data-provider="chatgpt">
            <header><p class="provider-name">ChatGPT 网页</p><a class="official-link" href="https://chatgpt.com/" target="_blank" rel="noreferrer">打开官网</a></header>
            <textarea class="response-input" rows="5" aria-label="粘贴 ChatGPT 原始回复" placeholder="粘贴 ChatGPT 原始回复…"></textarea>
            <input class="source-input" type="url" aria-label="ChatGPT 官方会话链接" placeholder="官方会话链接（可选）" />
            <button class="save-response" type="button" data-provider-id="chatgpt">保存原文</button>
            <p class="save-status" role="status"></p>
          </article>
          <article class="relay-card" data-provider="claude">
            <header><p class="provider-name">Claude 网页</p><a class="official-link" href="https://claude.ai/" target="_blank" rel="noreferrer">打开官网</a></header>
            <textarea class="response-input" rows="5" aria-label="粘贴 Claude 原始回复" placeholder="粘贴 Claude 原始回复…"></textarea>
            <input class="source-input" type="url" aria-label="Claude 官方会话链接" placeholder="官方会话链接（可选）" />
            <button class="save-response" type="button" data-provider-id="claude">保存原文</button>
            <p class="save-status" role="status"></p>
          </article>
        </div>
      </details>
    </main>

    <template id="user-message-template">
      <article class="message message-user">
        <div class="message-meta"><span>你</span><time></time></div>
        <pre class="message-text"></pre>
        <p class="message-targets"></p>
      </article>
    </template>

    <template id="agent-message-template">
      <article class="message message-agent">
        <div class="agent-avatar"></div>
        <div class="message-body">
          <div class="message-meta"><span class="provider-name"></span><time></time></div>
          <pre class="message-text"></pre>
          <a class="source-link" target="_blank" rel="noreferrer" hidden>打开官方会话</a>
        </div>
      </article>
    </template>

    <script type="module" src="src/sidepanel.js"></script>
  </body>
</html>
