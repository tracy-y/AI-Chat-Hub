<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Chat Hub PoC</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">LOCAL · MANUAL RELAY</p>
        <h1>AI Chat Hub</h1>
        <p class="subtitle">在官方页面亲自发送，再把原始回复保存到一个窗口。</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <div class="section-heading">
          <h2 id="composer-title">第一步：复制问题</h2>
          <span class="badge">零网站权限</span>
        </div>
        <label for="prompt">问题</label>
        <textarea id="prompt" rows="5" placeholder="输入准备发送给两个官方平台的问题…"></textarea>
        <button id="copy-prompt" type="button">复制问题</button>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </section>

      <section aria-labelledby="relay-title">
        <div class="section-heading">
          <h2 id="relay-title">第二步：官方发送并保存原文</h2>
        </div>
        <div class="relay-grid">
          <article class="relay-card" data-provider="chatgpt">
            <header>
              <div>
                <p class="provider-name">ChatGPT</p>
                <p class="provider-help">在官方页面发送，然后复制完整回复。</p>
              </div>
              <a class="official-link" href="https://chatgpt.com/" target="_blank" rel="noreferrer">打开官网</a>
            </header>
            <label for="response-chatgpt">粘贴 ChatGPT 原始回复</label>
            <textarea id="response-chatgpt" class="response-input" rows="7" placeholder="在这里按 Command + V…"></textarea>
            <label for="source-chatgpt">官方会话链接（可选）</label>
            <input id="source-chatgpt" class="source-input" type="url" placeholder="https://chatgpt.com/…" />
            <button class="save-response" type="button" data-provider-id="chatgpt">保存 ChatGPT 原文</button>
            <p class="save-status" role="status"></p>
          </article>

          <article class="relay-card" data-provider="claude">
            <header>
              <div>
                <p class="provider-name">Claude</p>
                <p class="provider-help">在官方页面发送，然后复制完整回复。</p>
              </div>
              <a class="official-link" href="https://claude.ai/" target="_blank" rel="noreferrer">打开官网</a>
            </header>
            <label for="response-claude">粘贴 Claude 原始回复</label>
            <textarea id="response-claude" class="response-input" rows="7" placeholder="在这里按 Command + V…"></textarea>
            <label for="source-claude">官方会话链接（可选）</label>
            <input id="source-claude" class="source-input" type="url" placeholder="https://claude.ai/…" />
            <button class="save-response" type="button" data-provider-id="claude">保存 Claude 原文</button>
            <p class="save-status" role="status"></p>
          </article>
        </div>
      </section>

      <section aria-labelledby="results-title">
        <div class="section-heading">
          <h2 id="results-title">原始回复</h2>
          <button id="clear-history" class="text-button" type="button">清除全部历史</button>
        </div>
        <div id="results" class="results" aria-live="polite"></div>
      </section>
    </main>

    <template id="result-template">
      <article class="result-card">
        <header>
          <div>
            <p class="provider-name"></p>
            <p class="timestamp"></p>
          </div>
          <span class="status"></span>
        </header>
        <details class="prompt-details">
          <summary>查看对应问题</summary>
          <pre class="prompt-text"></pre>
        </details>
        <pre class="response-text"></pre>
        <a class="source-link" target="_blank" rel="noreferrer" hidden>打开官方会话</a>
      </article>
    </template>

    <script type="module" src="src/sidepanel.js"></script>
  </body>
</html>
